version: "3"
services:
    db:
        container_name: db
        image: postgres:18
        hostname: db
        restart: unless-stopped
        shm_size: 128mb
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: 74123
            POSTGRES_DB: conferencedb
            POSTGRESQL_MAX_PREPARED_TRANSACTIONS: 64
            POSTGRESQL_SHARED_BUFFERS: 128MB
        ports:
            - "8001:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d conferencedb"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - conference_network

    nginx:
        image: nginx:alpine
        container_name: nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/ssl:/etc/nginx/ssl:ro
        depends_on:
            - frontend
            - go_api
        networks:
            - conference_network

    coturn:
        image: coturn/coturn:latest
        container_name: coturn
        restart: unless-stopped
        ports:
            - "3478:3478/udp"
            - "3478:3478/tcp"
            - "49152-49252:49152-49252/udp"
        command:
            - -n
            - --log-file=stdout
            - --listening-port=3478
            - --listening-ip=0.0.0.0
            - --external-ip=81.30.105.33
            - --relay-ip=0.0.0.0
            - --min-port=49152
            - --max-port=49252
            - --realm=conference.local
            - --user=webrtc:secure_password_123
            - --lt-cred-mech
            - --fingerprint
            - --no-multicast-peers
            - --no-cli
            - --verbose
        networks:
            - conference_network

    rrtc:
        build:
            context: ./rrtc
            dockerfile: dockerfile
        container_name: rrtc
        restart: unless-stopped
        environment:
            RUST_LOG: info
            SIGNALING_PORT: 8080
            LISTEN_ADDRESS: 0.0.0.0
            MAX_PARTICIPANTS: 50
            VERBOSE_LOGGING: "false"
            # TURN конфигурация
            TURN_URLS: "turn:81.30.105.33:3478?transport=udp,turn:81.30.105.33:3478?transport=tcp"
            TURN_USERNAME: webrtc
            TURN_CREDENTIAL: secure_password_123
        ports:
            - "8081:8080" # WebSocket signaling
        depends_on:
            - coturn
        networks:
            - conference_network
        healthcheck:
            test: ["CMD", "pgrep", "rrtc"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    go_api:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: go_api
        environment:
            DB_HOST: db
            DB_PORT: 5432
            DB_USER: postgres
            DB_PASSWORD: 74123
            DB_NAME: conferencedb
            DB_SSLMODE: disable
            PORT: 8080
            RUST_SFU_URL: ws://rrtc:8080
        env_file:
            - .env.docker
        ports:
            - "8080:8080"
        depends_on:
            db:
                condition: service_healthy
            rrtc:
                condition: service_healthy
        networks:
            - conference_network

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: frontend
        restart: unless-stopped
        environment:
            # API и WebSocket URLs
            REACT_APP_API_URL: https://81.30.105.33/api
            REACT_APP_WS_URL: wss://81.30.105.33/ws
            # ICE серверы для клиента (можно переопределить в коде)
            REACT_APP_STUN_URL: stun:stun.l.google.com:19302
            REACT_APP_TURN_URL: turn:81.30.105.33:3478
        depends_on:
            - go_api
            - rrtc
        stdin_open: true
        tty: true
        networks:
            - conference_network

volumes:
    postgres_data:
        driver: local

networks:
    conference_network:
        driver: bridge
