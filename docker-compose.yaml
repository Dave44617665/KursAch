version: '3'
  
services:
  go_api:
    build: ./backend/.
    container_name: go_api
    ports:
      - "0.0.0.0:8080:8080"
    restart: no
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend/.
    container_name: frontend
    ports:
      - '3000:3000'
    volumes:
      - ./frontend/:/app
      - /frontend/node_modules
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
    

  db:
    container_name: db
    image: postgres:18
    hostname: db
    restart: no
    shm_size: 128mb
    env_file:
      - .env.docker
    environment:
      DB_USER: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 74123
      POSTGRES_DB: conferencedb
    ports:
      - "8001:5432"
    
    healthcheck:
        test: ["CMD-SHELL", "pg_isready"]
        interval: 2s
        timeout: 3s
        retries: 5